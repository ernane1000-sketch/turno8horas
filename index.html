<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="screen-orientation" content="portrait">
  <meta name="x5-orientation" content="portrait">
  <title>Turno Rotativo 8h</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen p-4 max-w-md mx-auto pb-10">

  <!-- CABEÇALHO -->
  <header class="text-center my-4">
    <h1 class="text-2xl font-bold text-blue-400">Escala Turno Rotativo</h1>
    <p id="subtituloMes" class="text-xs text-slate-400 font-semibold mt-1">CARREGANDO...</p>
  </header>

  <!-- SELEÇÃO DE EQUIPE -->
  <div class="glass p-3 rounded-xl mb-4 text-center">
    <label class="block text-xs text-slate-400 mb-2 font-bold">SELECIONE A EQUIPE:</label>
    <div class="grid grid-cols-4 gap-2" id="gridEquipes">
      <button onclick="selecionarEquipe('A')" id="btnEquipeA" class="py-2 rounded font-bold text-slate-900 bg-emerald-400 transition">A</button>
      <button onclick="selecionarEquipe('B')" id="btnEquipeB" class="py-2 rounded font-bold text-slate-900 bg-slate-300 transition">B</button>
      <button onclick="selecionarEquipe('C')" id="btnEquipeC" class="py-2 rounded font-bold text-slate-900 bg-slate-300 transition">C</button>
      <button onclick="selecionarEquipe('D')" id="btnEquipeD" class="py-2 rounded font-bold text-slate-900 bg-slate-300 transition">D</button>
    </div>
  </div>

  <!-- NAVEGAÇÃO DE MÊS -->
  <div class="flex justify-between items-center mb-3 px-1">
    <button onclick="mudarMes(-1)" id="btnMesAnt" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded text-slate-300 font-bold border border-slate-700">&lt; ANT</button>
    <span id="labelMesAno" class="font-bold text-sm text-slate-200">OUTUBRO / 2026</span>
    <button onclick="mudarMes(1)" id="btnMesProx" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded text-slate-300 font-bold border border-slate-700">PROX &gt;</button>
  </div>

  <!-- CALENDÁRIO MENSAL -->
  <div class="glass p-3 rounded-xl mb-4">
    <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs text-slate-400 mb-2 border-b border-slate-700 pb-2">
      <div>DOM</div><div>SEG</div><div>TER</div><div>QUA</div><div>QUI</div><div>SEX</div><div>SÁB</div>
    </div>
    <div id="gridCalendario" class="grid grid-cols-7 gap-1 text-center"></div>
  </div>

  <!-- DETALHES DO DIA SELECIONADO -->
  <div class="glass p-4 rounded-xl border-l-4 border-blue-500 mb-4" id="painelDetalhes">
    <div id="textoDiaEscala" class="text-xs text-slate-400 font-semibold">Detalhes do turno</div>
    <div id="textoTurno" class="text-lg font-bold text-white mt-1">Selecione um dia na tabela para ver o horário.</div>
  </div>

  <!-- LEGENDA DE CORES -->
  <div class="glass p-3 rounded-xl text-xs space-y-2">
    <div class="font-bold text-slate-400 text-center mb-1">LEGENDA DE HORÁRIOS</div>
    <div class="grid grid-cols-2 gap-2">
      <div class="flex items-center space-x-2">
        <div class="w-4 h-4 rounded" style="background-color: rgb(150, 200, 255);"></div>
        <span class="text-slate-300">07:00 às 15:00h</span>
      </div>
      <div class="flex items-center space-x-2">
        <div class="w-4 h-4 rounded" style="background-color: rgb(255, 230, 80);"></div>
        <span class="text-slate-300">15:00 às 23:00h</span>
      </div>
      <div class="flex items-center space-x-2">
        <div class="w-4 h-4 rounded" style="background-color: rgb(255, 180, 100);"></div>
        <span class="text-slate-300">23:00 às 07:00h</span>
      </div>
      <div class="flex items-center space-x-2">
        <div class="w-4 h-4 rounded" style="background-color: rgb(120, 230, 120);"></div>
        <span class="text-slate-300">Folga</span>
      </div>
    </div>
  </div>

  <script>
    // Tenta bloquear a orientação do ecrã para retrato via código
    if (window.screen && window.screen.orientation && window.screen.orientation.lock) {
      window.screen.orientation.lock("portrait").catch(() => {});
    }

    const ciclo = [
      ["3° dia|07:00 às 15:00h", "2° dia|15:00 às 23:00h", "2° dia|Folga grande", "2° dia|23:00 às 07:00h"],
      ["4° dia|07:00 às 15:00h", "3° dia|15:00 às 23:00h", "3° dia|Folga grande", "3° dia|23:00 às 07:00h"],
      ["5° dia|07:00 às 15:00h", "1° dia|23:00 às 07:00h", "1° dia|15:00 às 23:00h", "1° dia|Folga"],
      ["6° dia|07:00 às 15:00h", "2° dia|23:00 às 07:00h", "2° dia|15:00 às 23:00h", "2° dia|Folga"],
      ["1° dia|Folga", "3° dia|23:00 às 07:00h", "3° dia|15:00 às 23:00h", "1° dia|07:00 às 15:00h"],
      ["1° dia|15:00 às 23:00h", "1° dia|Folga", "1° dia|23:00 às 07:00h", "2° dia|07:00 às 15:00h"],
      ["2° dia|15:00 às 23:00h", "2° dia|Folga", "2° dia|23:00 às 07:00h", "3° dia|07:00 às 15:00h"],
      ["3° dia|15:00 às 23:00h", "3° dia|Folga", "3° dia|23:00 às 07:00h", "4° dia|07:00 às 15:00h"],
      ["1° dia|23:00 às 07:00h", "1° dia|15:00 às 23:00h", "1° dia|Folga", "5° dia|07:00 às 15:00h"],
      ["2° dia|23:00 às 07:00h", "2° dia|15:00 às 23:00h", "2° dia|Folga", "6° dia|07:00 às 15:00h"],
      ["3° dia|23:00 às 07:00h", "3° dia|15:00 às 23:00h", "1° dia|07:00 às 15:00h", "1° dia|Folga"],
      ["1° dia|Folga", "1° dia|23:00 às 07:00h", "2° dia|07:00 às 15:00h", "1° dia|15:00 às 23:00h"],
      ["2° dia|Folga", "2° dia|23:00 às 07:00h", "3° dia|07:00 às 15:00h", "2° dia|15:00 às 23:00h"],
      ["3° dia|Folga", "3° dia|23:00 às 07:00h", "4° dia|07:00 às 15:00h", "3° dia|15:00 às 23:00h"],
      ["1° dia|15:00 às 23:00h", "1° dia|Folga", "5° dia|07:00 às 15:00h", "1° dia|23:00 às 07:00h"],
      ["2° dia|15:00 às 23:00h", "2° dia|Folga", "6° dia|07:00 às 15:00h", "2° dia|23:00 às 07:00h"],
      ["3° dia|15:00 às 23:00h", "1° dia|07:00 às 15:00h", "1° dia|Folga", "3° dia|23:00 às 07:00h"],
      ["1° dia|23:00 às 07:00h", "2° dia|07:00 às 15:00h", "1° dia|15:00 às 23:00h", "1° dia|Folga"],
      ["2° dia|23:00 às 07:00h", "3° dia|07:00 às 15:00h", "2° dia|15:00 às 23:00h", "2° dia|Folga"],
      ["3° dia|23:00 às 07:00h", "4° dia|07:00 às 15:00h", "3° dia|15:00 às 23:00h", "3° dia|Folga"],
      ["1° dia|Folga", "5° dia|07:00 às 15:00h", "1° dia|23:00 às 07:00h", "1° dia|15:00 às 23:00h"],
      ["2° dia|Folga", "6° dia|07:00 às 15:00h", "2° dia|23:00 às 07:00h", "2° dia|15:00 às 23:00h"],
      ["1° dia|07:00 às 15:00h", "1° dia|Folga", "3° dia|23:00 às 07:00h", "3° dia|15:00 às 23:00h"],
      ["2° dia|07:00 às 15:00h", "1° dia|15:00 às 23:00h", "1° dia|Folga", "1° dia|23:00 às 07:00h"]
    ];

    const nomesMeses = [
      "JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO",
      "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"
    ];

    let equipeSelecionada = "A";
    let dataAtual = new Date();
    dataAtual.setDate(1);

    function obterDadosDia(ano, mes, dia, equipe) {
      const data = Date.UTC(ano, mes, dia);
      const base = Date.UTC(2026, 8, 16);
      
      const diferenca = data - base;
      const dias = Math.floor(diferenca / (24 * 60 * 60 * 1000));
      
      let indice = dias % ciclo.length;
      if (indice < 0) indice += ciclo.length;

      let coluna = 0;
      if (equipe === "B") coluna = 1;
      else if (equipe === "C") coluna = 2;
      else if (equipe === "D") coluna = 3;

      return ciclo[indice][coluna].split("|");
    }

    function selecionarEquipe(equipe) {
      equipeSelecionada = equipe;
      ["A", "B", "C", "D"].forEach(e => {
        const btn = document.getElementById("btnEquipe" + e);
        btn.className = e === equipe 
          ? "py-2 rounded font-bold text-slate-900 bg-emerald-400 transition" 
          : "py-2 rounded font-bold text-slate-900 bg-slate-300 transition";
      });
      renderizarCalendario();
    }

    function mudarMes(delta) {
      dataAtual.setMonth(dataAtual.getMonth() + delta);
      renderizarCalendario();
    }

    function selecionarDia(dia) {
      const ano = dataAtual.getFullYear();
      const mes = dataAtual.getMonth();
      const dados = obterDadosDia(ano, mes, dia, equipeSelecionada);

      document.getElementById("textoDiaEscala").innerText = `Equipe ${equipeSelecionada} — Dia ${dia}/${mes + 1}/${ano} (${dados[0]})`;
      document.getElementById("textoTurno").innerText = `Horário: ${dados[1]}`;
    }

    function renderizarCalendario() {
      const ano = dataAtual.getFullYear();
      const mes = dataAtual.getMonth();

      document.getElementById("subtituloMes").innerText = `${nomesMeses[mes]} / ${ano} — EQUIPE ${equipeSelecionada}`;
      document.getElementById("labelMesAno").innerText = `${nomesMeses[mes]} / ${ano}`;

      const mesAntIdx = (mes === 0) ? 11 : mes - 1;
      const mesProxIdx = (mes === 11) ? 0 : mes + 1;
      document.getElementById("btnMesAnt").innerText = `< ${nomesMeses[mesAntIdx].slice(0,3)}`;
      document.getElementById("btnMesProx").innerText = `${nomesMeses[mesProxIdx].slice(0,3)} >`;

      const grid = document.getElementById("gridCalendario");
      grid.innerHTML = "";

      const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
      const totalDias = new Date(ano, mes + 1, 0).getDate();

      for (let i = 0; i < primeiroDiaSemana; i++) {
        grid.appendChild(document.createElement("div"));
      }

      for (let dia = 1; dia <= totalDias; dia++) {
        const dados = obterDadosDia(ano, mes, dia, equipeSelecionada);
        const horario = dados[1];

        const celula = document.createElement("button");
        celula.innerText = dia;
        celula.className = "py-2 font-bold text-xs rounded border border-white/20 transition text-slate-900";

        if (horario.includes("Folga")) {
          celula.style.backgroundColor = "rgb(120, 230, 120)";
        } else if (horario.startsWith("07:00")) {
          celula.style.backgroundColor = "rgb(150, 200, 255)";
        } else if (horario.startsWith("15:00")) {
          celula.style.backgroundColor = "rgb(255, 230, 80)";
        } else if (horario.startsWith("23:00")) {
          celula.style.backgroundColor = "rgb(255, 180, 100)";
        }

        celula.onclick = () => selecionarDia(dia);
        grid.appendChild(celula);
      }
      
      document.getElementById("textoDiaEscala").innerText = "Detalhes do turno";
      document.getElementById("textoTurno").innerText = "Selecione um dia na tabela para ver o horário.";
    }

    renderizarCalendario();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("Service Worker e Cache Offline configurados com sucesso!"))
        .catch((err) => console.log("Erro ao registar Service Worker:", err));
    }
  </script>
</body>
</html>
